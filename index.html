<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
  <meta name="theme-color" content="#C60C30" />
  <meta name="description" content="Hangugeo — A Korean Learning Tool with dictionary, flashcards, numbers, colors, pronunciation, romanization, and hanja." />
  <title>한국말 공부 · Hangugeo</title>

  <!-- Google Fonts: Korean-capable fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Nanum+Gothic:wght@400;700;800&family=Nanum+Myeongjo:wght@400;700;800&family=Noto+Serif+TC:wght@400;700&family=Yuji+Boku&display=swap" rel="stylesheet" />

  <!-- Font Awesome 4.7 (local) -->
  <link rel="stylesheet" href="assets/fonts/font-awesome.min.css" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/hangugeo.png" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <div class="app">
    <!-- Header: brand + language selector -->
    <header class="header">
      <div class="brand" id="brand">
        <div class="logo">🇰🇷</div>
        <div>
          <div class="title">한국말 공부</div>
          <div class="subtitle" id="appSubtitle"></div>
        </div>
      </div>
      <div class="lang" id="langSel"></div>
    </header>

    <!-- Banners (data status + vocabulary queue lock) -->
    <div id="bannerHost"></div>

    <!-- Main routed view -->
    <main id="main"></main>
  </div>

  <!-- Hangul.js: Korean text processing (kept from original) -->
  <script src="assets/hangul.js"></script>

  <!-- Core libs (order matters) -->
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/icons.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/tts.js"></script>
  <script src="assets/js/staticdata.js"></script>

  <!-- Hanja data: full character database + utils (272KB) -->
  <script src="assets/hanja-utils.js"></script>
  <script src="assets/hanja.js"></script>

  <!-- Full dictionary dataset (13,669 words, ~2MB) -->
  <script src="assets/hangugeo_data.js"></script>
  <script src="assets/js/lexicon.js"></script>

  <!-- App + modules -->
  <script src="assets/js/app.js"></script>
</body>
</html>
